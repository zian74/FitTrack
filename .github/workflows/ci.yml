name: CI
on:
  push:
    branches: ['**']
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Syntaxe JS
        run: node --check app.js && node --check sw.js
      - name: Fichiers essentiels
        run: |
          test -f index.html
          test -f style.css
          test -f manifest.webmanifest
          grep -q "14" README.md
      - name: Valider JSON
        run: |
          python3 -c "import json; json.load(open('package.json'))"
          python3 -c "import json; json.load(open('manifest.webmanifest'))"
